<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projets · Pono</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <header class="brand">
    <strong>Pono</strong>
    <div>
      <button class="icon-button" data-action="all" aria-label="Tous les projets" data-icon="grid"></button>
      <button class="icon-button" data-action="check" aria-label="Journal des preuves" data-icon="check"></button>
      <button class="icon-button" data-action="sidebar" aria-label="Réduire le panneau" data-icon="panel"></button>
    </div>
  </header>

  <nav aria-label="Navigation principale">
    <button data-action="new"><i data-icon="plus"></i>Nouveau projet</button>
    <button data-action="search"><i data-icon="search"></i>Rechercher</button>
    <button data-action="deployments"><i data-icon="books"></i>Déploiements</button>
    <button data-action="quotas"><i data-icon="teach"></i>Quotas</button>
  </nav>

  <p class="nav-label">Atelier</p>
  <nav aria-label="Atelier">
    <button data-action="projects"><i data-icon="graduate" class="colored"></i>Projets</button>
    <button data-action="connections"><i data-icon="agent"></i>Connexions</button>
    <button data-action="more"><i data-icon="more"></i>Plus d’outils</button>
  </nav>

  <p class="nav-label projects-label">Projets récents</p>
  <nav class="recents" aria-label="Projets récents">
    <button data-project="lectio">lectio · preview #12</button>
    <button data-project="nyatefe">nyatefe · migration refusée</button>
    <button data-project="vestio">vestio · en ligne</button>
  </nav>

  <div class="palette" aria-label="Palette de la charte">
    <span style="--swatch:#1ca18c" title="#1ca18c · Vert"></span>
    <span style="--swatch:#f99d32" title="#f99d32 · Orange"></span>
    <span style="--swatch:#ffffff" title="#ffffff · Blanc"></span>
    <span style="--swatch:#e8e748" title="#e8e748 · Jaune"></span>
    <span style="--swatch:#875028" title="#875028 · Café"></span>
    <small>Couleurs de la charte</small>
  </div>
</aside>

<main>
  <div class="toolbar">
    <button class="icon-button mobile-menu" data-action="sidebar" aria-label="Afficher la navigation" data-icon="panel"></button>
    <div class="deploy-wrap">
      <button class="deploy" id="deploy-button" aria-expanded="false">
        <i data-icon="download"></i>Mettre en ligne<i data-icon="chevron"></i>
      </button>
      <div class="dropdown" id="deploy-menu" hidden>
        <button data-case="accord">lectio · production <span>→</span></button>
        <button data-case="refus">nyatefe · production <span>→</span></button>
      </div>
    </div>
  </div>

  <div class="content">
    <h1>Projets</h1>

    <section aria-label="Projets de l’atelier">
      <div class="projects-grid" id="main-projects"></div>
      <div class="all-link"><button id="all-projects">Tous les projets <i data-icon="arrow"></i></button></div>
    </section>

    <section class="deployments">
      <h2>Déploiements récents</h2>
      <div class="deployment-grid" id="deployments"></div>
    </section>

    <section class="states">
      <h2>Explorer par état</h2>
      <div class="chips" role="group" aria-label="États">
        <button class="chip" data-state="pose" aria-pressed="false">Posés</button>
        <button class="chip" data-state="cours" aria-pressed="false">En cours</button>
        <button class="chip active" data-state="attention" aria-pressed="true">Attention</button>
        <button class="chip" data-state="panne" aria-pressed="false">En panne</button>
        <div class="more-wrap">
          <button class="chip" id="more-states" aria-expanded="false">1 autre<i data-icon="chevron"></i></button>
          <div class="dropdown" id="state-menu" hidden></div>
        </div>
      </div>
      <div id="state-results" hidden>
        <h3 id="state-title"></h3>
        <div class="results-grid" id="results"></div>
      </div>
    </section>
  </div>
</main>

<dialog id="detail">
  <form method="dialog"><button class="dialog-close icon-button" aria-label="Fermer">×</button></form>
  <div id="detail-content"></div>
</dialog>

<div id="toast" role="status" hidden></div>
</body>
</html>
