openapi: 3.1.0
info:
  title: Pono API
  version: 0.1.0
  description: >
    Phase 1 surface of the Pono control plane. Served same-origin behind the console at /api.
    Errors never carry prose: only a stable code the console translates (error-codes.md).
servers:
  - url: /api/v1
security:
  - session: []

paths:
  /auth/login:
    get:
      summary: Start sign-in with the code host identity.
      security: []
      responses:
        "302": { description: Redirect to the code host authorization page. }
  /auth/callback:
    get:
      summary: Complete sign-in; creates the personal organization on first sign-in.
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302": { description: Session cookie set; redirect to the workshop. }
        "403": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: Revoke the current session.
      responses:
        "204": { description: Session revoked. }

  /me:
    get:
      summary: Current person, organization and locale.
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
  /me/locale:
    put:
      summary: Persist the explicit language choice.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locale]
              properties:
                locale: { $ref: "#/components/schemas/Locale" }
      responses:
        "204": { description: Saved. }
        "422": { $ref: "#/components/responses/Error" }

  /me/email:
    put:
      summary: Where quota alerts go when the code host keeps the address private (FR-025).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        "204": { description: Saved. }
        "422": { $ref: "#/components/responses/Error" }

  /connections:
    get:
      summary: Connections of the current organization with their status.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Connection" }
    post:
      summary: Register a hosting or database connection authorized at the provider.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectionRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /connections/code-host:
    post:
      summary: >
        Link the installation of the Pono app on the person's own code host account. No key is
        asked (FR-010); the person installs the app from `Me.codeHostInstallUrl` first.
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "422": { $ref: "#/components/responses/Error" }
  /connections/{connectionId}:
    delete:
      summary: Revoke a connection immediately (FR-012).
      parameters: [{ $ref: "#/components/parameters/ConnectionId" }]
      responses:
        "204": { description: Revoked. }
        "404": { $ref: "#/components/responses/Error" }

  /repositories:
    get:
      summary: Repositories reachable through the code host connection (FR-014).
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Repository" }

  /projects:
    get:
      summary: Workshop list with state, environments, last deployment and quotas.
      parameters:
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/ProjectState" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workshop" }
    post:
      summary: Import a repository as a project; proposes a manifest when absent (FR-018).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repository]
              properties:
                repository: { type: string, example: "owner/name" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /projects/{projectId}:
    get:
      summary: Project detail, including every open preview.
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/manifest-proposal:
    post:
      summary: >
        Propose a manifest again after the person closed the previous proposal. Pono never
        reopens one on its own.
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectDetail" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /projects/{projectId}/refresh:
    post:
      summary: Request an immediate reading (FR-022).
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "202": { description: Reading queued. }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pono_session

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: Stable, language-independent error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Locale:
      type: string
      enum: [fr, en]
    ProjectState:
      type: string
      enum: [healthy, active, warning, failing, idle]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code: { type: string, example: project.already_imported }
            field: { type: string }
    Me:
      type: object
      required: [personId, login, organizationId]
      properties:
        personId: { type: string, format: uuid }
        login: { type: string }
        organizationId: { type: string, format: uuid }
        locale: { oneOf: [{ $ref: "#/components/schemas/Locale" }, { type: "null" }] }
        email:
          type: [string, "null"]
          description: Where quota alerts are sent; null when unknown.
        alertEmailsEnabled:
          type: boolean
          description: False while the service has no mail server; alerts stay in the workshop.
        codeHostInstallUrl:
          type: [string, "null"]
          description: Where the person installs the Pono app on chosen repositories.
    Connection:
      type: object
      required: [id, kind, provider, externalRef, status, statusCheckedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [code_host, hosting, database] }
        provider: { type: string }
        externalRef: { type: string, description: Installation or account at the provider. }
        status: { type: string, enum: [active, expired, revoked] }
        statusCheckedAt: { type: string, format: date-time }
    ConnectionRequest:
      type: object
      required: [kind, provider, authorization]
      properties:
        kind: { type: string, enum: [hosting, database] }
        provider: { type: string }
        authorization:
          type: string
          description: Provider-issued authorization; stored encrypted, never returned.
          writeOnly: true
        endpoint:
          type: [string, "null"]
          description: Base URL of a self-hosted provider (required for coolify).
    Repository:
      type: object
      required: [fullName, defaultBranch, alreadyImported]
      properties:
        fullName: { type: string }
        defaultBranch: { type: string }
        alreadyImported: { type: boolean }
        projectId:
          type: [string, "null"]
          format: uuid
          description: The project it already is, offered instead of a second import.
    Environment:
      type: object
      required: [id, kind, linkStatus, resourceStatus]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [production, preview, development] }
        branch: { type: [string, "null"] }
        url: { type: [string, "null"] }
        provider: { type: [string, "null"], description: Hosting adapter id. }
        resourceStatus:
          type: string
          enum: [found, missing, unknown]
          description: Whether the site or application exists at its provider; never invented.
        linkStatus: { type: string, enum: [up, down, unknown, missing] }
        linkCheckedAt: { type: [string, "null"], format: date-time }
        openedAt: { type: [string, "null"], format: date-time }
    Deployment:
      type: object
      required: [environmentKind, status, startedAt]
      properties:
        environmentKind: { type: string, enum: [production, preview, development] }
        status: { type: string, enum: [building, succeeded, failed, cancelled] }
        commitSha: { type: [string, "null"] }
        author: { type: [string, "null"] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
    Quota:
      type: object
      required: [metric, used, limit, limitSource, ratio, readAt]
      properties:
        metric:
          type: string
          enum: [hosting_bandwidth_bytes, db_compute_seconds, db_storage_bytes, db_transfer_bytes]
        used: { type: number }
        limit: { type: [number, "null"], description: Null when the provider does not state it. }
        limitSource:
          type: string
          enum: [account_plan, free_tier_estimate]
          description: Shown next to every limit (FR-024).
        ratio: { type: [number, "null"] }
        readAt: { type: string, format: date-time }
    ProjectSummary:
      type: object
      required:
        [id, repository, name, state, stateReason, manifestStatus, environments, refreshedAt, stale]
      properties:
        id: { type: string, format: uuid }
        repository: { type: string }
        name: { type: string }
        state: { $ref: "#/components/schemas/ProjectState" }
        stateReason:
          type: string
          description: The state rule that applied, translated by the console.
          enum:
            - production_down
            - deployment_failed
            - quota_warning
            - connection_expired
            - deployment_in_progress
            - recent_activity
            - no_recent_activity
            - nominal
        manifestStatus: { type: string, enum: [present, proposed, absent] }
        databaseStatus: { type: [string, "null"], enum: [found, missing, unknown, null] }
        environments:
          type: array
          description: Production, development and the most recent preview only.
          items: { $ref: "#/components/schemas/Environment" }
        lastDeployment: { oneOf: [{ $ref: "#/components/schemas/Deployment" }, { type: "null" }] }
        quota: { oneOf: [{ $ref: "#/components/schemas/Quota" }, { type: "null" }] }
        lastActivityAt: { type: [string, "null"], format: date-time }
        refreshedAt:
          type: [string, "null"]
          format: date-time
          description: Last complete reading (FR-023); null until the first one.
        stale:
          type: boolean
          description: The last reading was incomplete; values date from refreshedAt.
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/ProjectSummary"
        - type: object
          properties:
            manifestProposalUrl: { type: [string, "null"] }
            previews:
              type: array
              items: { $ref: "#/components/schemas/Environment" }
            quotas:
              type: array
              items: { $ref: "#/components/schemas/Quota" }
    Workshop:
      type: object
      required: [projects, counts, verdicts]
      properties:
        projects:
          type: array
          items: { $ref: "#/components/schemas/ProjectSummary" }
        counts:
          type: object
          description: Number of projects per state, shown on each filter (FR-027).
          additionalProperties: { type: integer }
        verdicts:
          type: array
          description: What needs a decision, shown before the list.
          items:
            type: object
            required: [projectId, code]
            properties:
              projectId: { type: string, format: uuid }
              code: { type: string, example: project.production_down }
