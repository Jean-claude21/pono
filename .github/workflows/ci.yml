name: CI

on:
  push:
    branches: [main, dev, "[0-9][0-9][0-9]-*"]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The build generates the Paraglide messages that the typecheck reads.
      - run: pnpm --filter @pono/web build
      - run: pnpm --filter @pono/web typecheck

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pono_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
      PONO_TEST_OWNER_URL: postgresql://pono_owner:pono_owner@localhost:5432/pono_test
      PONO_TEST_APP_URL: postgresql://pono_app:pono_app@localhost:5432/pono_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: psql -h localhost -U postgres -d pono_test -f apps/api/tests/bootstrap_roles.sql
      - run: uv sync --frozen
      - run: uv run ruff check apps/api
      - run: uv run ruff format --check apps/api
      - run: uv run mypy
      - run: uv run pytest
      # The SDK must match the service: a changed contract without a regenerated SDK fails here.
      - run: uv run python apps/api/scripts/export_openapi.py /tmp/openapi.json
      - run: diff /tmp/openapi.json packages/sdk/openapi.json
